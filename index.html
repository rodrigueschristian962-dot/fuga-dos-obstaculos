
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuga dos Obstáculos</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
h1 { color: #45e6ff; margin: 20px 0 8px; }
p { color: #cbd5e1; }
canvas {
  background: #17243a;
  border: 3px solid #45e6ff;
  border-radius: 12px;
  width: min(94vw, 500px);
  height: auto;
  touch-action: none;
}
button {
  background: #13b9d5;
  border: 0;
  border-radius: 10px;
  padding: 13px 22px;
  margin: 6px;
  color: #071522;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}
.controls { margin: 10px; }
</style>
</head>
<body>
<h1>🚀 Fuga dos Obstáculos</h1>
<p>Desvie dos blocos vermelhos e pegue as moedas!</p>
<p>Pontuação: <strong id="score">0</strong> | Recorde: <strong id="best">0</strong></p>
<canvas id="game" width="480" height="600"></canvas>
<div>
  <button onclick="startGame()">▶ Jogar / Reiniciar</button>
</div>
<div class="controls">
  <button id="left">⬅ Esquerda</button>
  <button id="right">Direita ➡</button>
</div>
<p>Use as setas do teclado ou os botões na tela.</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score");
const bestText = document.getElementById("best");

let player, obstacles, coins, score, running, gameOver;
let left = false, right = false, frame = 0;
let best = Number(localStorage.getItem("fugaRecorde") || 0);
bestText.textContent = best;

function startGame() {
  player = { x: 220, y: 520, w: 40, h: 40, speed: 6 };
  obstacles = [];
  coins = [];
  score = 0;
  frame = 0;
  running = true;
  gameOver = false;
  scoreText.textContent = score;
  requestAnimationFrame(loop);
}

function buttonControl(id, direction) {
  const btn = document.getElementById(id);
  btn.addEventListener("pointerdown", e => {
    e.preventDefault();
    if (direction === "left") left = true;
    else right = true;
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(event => {
    btn.addEventListener(event, () => {
      if (direction === "left") left = false;
      else right = false;
    });
  });
}
buttonControl("left", "left");
buttonControl("right", "right");

document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key === "a") left = true;
  if (e.key === "ArrowRight" || e.key === "d") right = true;
});
document.addEventListener("keyup", e => {
  if (e.key === "ArrowLeft" || e.key === "a") left = false;
  if (e.key === "ArrowRight" || e.key === "d") right = false;
});

function hit(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

function loop() {
  if (!running) return;
  frame++;
  ctx.clearRect(0, 0, 480, 600);

  // Fundo
  ctx.fillStyle = "#17243a";
  ctx.fillRect(0, 0, 480, 600);
  ctx.fillStyle = "#263852";
  for (let y = (frame * 4) % 60; y < 600; y += 60) {
    ctx.fillRect(0, y, 480, 2);
  }

  // Jogador
  if (left) player.x -= player.speed;
  if (right) player.x += player.speed;
  player.x = Math.max(0, Math.min(440, player.x));

  ctx.fillStyle = "#45e6ff";
  ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.font = "27px Arial";
  ctx.fillText("🚀", player.x + 5, player.y + 31);

  // Criar obstáculos
  if (frame % 55 === 0) {
    obstacles.push({
      x: Math.random() * 420,
      y: -40, w: 42, h: 42,
      speed: 3 + Math.min(score / 100, 5)
    });
  }

  // Criar moedas
  if (frame % 100 === 0) {
    coins.push({ x: 15 + Math.random() * 430, y: -30, w: 25, h: 25 });
  }

  obstacles.forEach(o => {
    o.y += o.speed;
    ctx.fillStyle = "#ff4757";
    ctx.fillRect(o.x, o.y, o.w, o.h);
    if (hit(player, o)) endGame();
  });

  coins.forEach(c => {
    c.y += 3;
    ctx.font = "25px Arial";
    ctx.fillText("🪙", c.x, c.y + 22);
    if (!c.taken && hit(player, c)) {
      c.taken = true;
      score += 10;
    }
  });

  obstacles = obstacles.filter(o => o.y < 620);
  coins = coins.filter(c => c.y < 620 && !c.taken);

  if (frame % 10 === 0) score++;
  scoreText.textContent = score;

  if (score > best) {
    best = score;
    bestText.textContent = best;
    localStorage.setItem("fugaRecorde", best);
  }

  if (running) requestAnimationFrame(loop);
}

function endGame() {
  if (gameOver) return;
  running = false;
  gameOver = true;
  ctx.fillStyle = "rgba(0,0,0,0.78)";
  ctx.fillRect(0, 0, 480, 600);
  ctx.fillStyle = "white";
  ctx.textAlign = "center";
  ctx.font = "bold 38px Arial";
  ctx.fillText("FIM DE JOGO!", 240, 270);
  ctx.font = "24px Arial";
  ctx.fillText("Pontuação: " + score, 240, 320);
  ctx.font = "17px Arial";
  ctx.fillText("Clique em Jogar para tentar novamente", 240, 365);
  ctx.textAlign = "left";
}

startGame();
</script>
</body>
</html>
